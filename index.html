<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const CV = {'完成':'#2e7d32','進行中':'#1565c0','卡關':'#c62828','未啟動':'#b3bac2'};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 名稱顯示層：【重點】【非重點】為 L2 重點工項清單之控制標記，不對使用者顯示 */
const dispName = s => (s==null?'':String(s)).replace(/【重點】|【非重點】/g,'');
const byId = {}; D.items.forEach(i=>byId[i.id]=i);

document.getElementById('pname').textContent = D.plan['計畫名稱'] || D.project_root;
document.getElementById('hmeta').innerHTML = esc(D.plan['計畫編號']||'') +
  '｜' + esc(D.plan['全程期程']||'') + '｜生成 ' + esc(D.generated_at);

/* ---------- 狀態彙總 ---------- */
function roll(ids){
  const st = ids.map(x=>byId[x] ? byId[x].status : '未啟動');
  if(!st.length) return '未啟動';
  if(st.includes('卡關')) return '卡關';
  if(st.every(s=>s==='完成')) return '完成';
  if(st.some(s=>s==='完成'||s==='進行中')) return '進行中';
  return '未啟動';
}
const allAssets = [];
(D.layout ? D.layout.nodes : []).forEach(n=>(n.assets||[]).forEach(a=>{
  allAssets.push({name:a.name, items:a.items, node:n.id, col:n.col, status:roll(a.items)});
}));
const assetsOf = n => allAssets.filter(a=>a.node===n.id);
const nodeStatus = n => roll([].concat(...(n.assets||[]).map(a=>a.items)));
const yearOf = q => q==='P0' ? 'P0 預備期' : (q.match(/^Y\d/)||[''])[0];
const keyOf = y => y.startsWith('P0') ? 'P0 預備期' : y;
const quarters = [...new Set(D.items.map(i=>i.quarter))];
const cnt = list => { const c={完成:0,進行中:0,卡關:0,未啟動:0}; list.forEach(i=>c[i.status]++); return c; };
const dlState = d => d.days==null ? 'none' : (d.days<0 ? 'past' : (d.days<=30 ? 'near' : (d.days<=90 ? 'soon' : 'far')));
const dlColor = {past:'#8d99a6', near:'#c62828', soon:'#e8a33d', far:'#b3bac2', none:'#b3bac2'};
/* 年度色票：與 L1 架構圖之欄位識別色一致 */
const YC = {'P0 預備期':'#5b7083','Y1':'#7b2d8e','Y2':'#c0632a','Y3':'#1b5e3f'};
const ycOf = k => YC[k] || '#5b7083';
const tint = (hex,a) => { const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

/* ---------- 重點工項（L2 用）：有對應資產、或親力、或掛關鍵點；名稱可用【重點】強制納入、【非重點】強制排除 ---------- */
const assetItemIds = new Set([].concat(...allAssets.map(a=>a.items)));
const isKey = i => !/【非重點】/.test(i.name) && (/【重點】/.test(i.name) || assetItemIds.has(i.id) || /親力/.test(i.owner) || /D-\d/.test(i.due));

/* ---------- 路由 ---------- */
let route = {level:1, year:null, quarter:null};
/* 圖面縮放：'fit' 縮到容器寬（鳥瞰）／'real' 原尺寸＋水平捲動（文字恆為原字級） */
let zoom = 'real';
function setZoom(z){ zoom=z; render(); }
/* W 小於容器時一律原尺寸，不放大；大於時依 zoom 決定縮放或捲動 */
function svgStyle(W, fitMin){
  if(zoom==='fit') return `width:100%;max-width:${W}px;height:auto`;
  return `width:${W}px;max-width:${W}px;height:auto`;
}
function zoomBar(W){
  if(W<=1300) return '';
  return `<div class="zbar">圖寬 ${Math.round(W)}px
    <button class="${zoom==='real'?'on':''}" onclick="setZoom('real')">原尺寸（可讀）</button>
    <button class="${zoom==='fit'?'on':''}" onclick="setZoom('fit')">符合寬度（鳥瞰）</button></div>`;
}
function go(l,y,q){ route={level:l,year:y,quarter:q}; render(); window.scrollTo(0,0); }

function render(){
  const S=document.getElementById('stage'), L=document.getElementById('legend'),
        T=document.getElementById('strip'), C=document.getElementById('crumb'), ST=document.getElementById('stats');
  const c=['<a onclick="go(1)">三年架構</a>'];
  if(route.year) c.push(route.level>2?`<a onclick="go(2,'${route.year}')">${route.year}</a>`:`<b>${route.year}</b>`);
  if(route.quarter) c.push(`<b>${route.quarter}</b>`);
  C.innerHTML=c.join(' ＞ ');
  const E=document.getElementById('extra');
  if(route.level===1){ ST.innerHTML=statsL1(); S.innerHTML=svgL1(); L.innerHTML=legendL1(); T.innerHTML=''; E.innerHTML=quarterCards()+pubTrack(); }
  else if(route.level===2){ ST.innerHTML=statsL2(route.year); S.innerHTML=svgL2(route.year); L.innerHTML=legendStatus('點季節點進入工項層'); T.innerHTML=''; E.innerHTML=''; }
  else { ST.innerHTML=statsL3(route.quarter); S.innerHTML=svgL3(route.quarter); L.innerHTML=legendStatus('由左至右為依賴順序；點節點看工項卡'); T.innerHTML=''; E.innerHTML=''; }
}
const statBox = (lb,vl,sub,act)=>`<div class="stat${act?' nd act':''}"${act?' onclick="'+act+'"':''}><div class="lb">${lb}${act?' <span style="opacity:.55">›</span>':''}</div><div class="vl">${vl}${sub?' <small>'+sub+'</small>':''}</div></div>`;
function legendStatus(hint){
  return ['完成','進行中','卡關','未啟動'].map(k=>`<span><i style="background:${CV[k]}"></i>${k}</span>`).join('')
    + `<span style="margin-left:auto;color:#6b7784">${hint}</span>`;
}
function legendL1(){
  return legendStatus('點方塊看該階段產出資產；點年度標題進入年度層')
    + '<span><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="var(--flow)" stroke-width="6"/></svg> 年度內方法流</span>'
    + '<span><svg width="34" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="var(--data)" stroke-width="2"/></svg> 跨年度資料流</span>';
}

/* ---------- 統計條 ---------- */
function statsL1(){
  const a=allAssets, done=a.filter(x=>x.status==='完成').length;
  const dl=D.deadlines.filter(d=>d.days!=null);
  const near=dl.filter(d=>d.days>=0&&d.days<=90), past=dl.filter(d=>d.days<0);
  const nx=dl.filter(d=>d.days>=0).sort((x,y)=>x.days-y.days)[0];
  const c=cnt(D.items);
  return statBox('產出資產到位', done+' / '+a.length, '', "showAssets()")
    + statBox('下一個關鍵點', nx?('剩 '+nx.days+' 天'):'—', nx?esc(nx.id+'　'+nx.when):'', nx?("showDeadline('"+nx.id+"')"):'')
    + statBox('關鍵點', near.length+' 項', '90 天內｜已過 '+past.length, "showDeadlines()")
    + statBox('工項', c['完成']+' / '+D.items.length, '進行中 '+c['進行中']+'｜卡關 '+c['卡關'], "showItems()");
}
function statsL2(y){
  const its=D.items.filter(i=>yearOf(i.quarter)===y), c=cnt(its);
  const a=allAssets.filter(x=>x.col===y);
  const dl=D.deadlines.filter(d=>d.year===y), nx=dl.filter(d=>d.days>=0).sort((p,q)=>p.days-q.days)[0];
  const yy=D.years.find(x=>keyOf(x.year)===y);
  return statBox('年度主題', '<span style="font-size:14px">'+esc(yy?yy.theme:'—')+'</span>')
    + statBox('產出資產', a.filter(x=>x.status==='完成').length+' / '+a.length)
    + statBox('工項', c['完成']+' / '+its.length, '進行中 '+c['進行中']+'｜卡關 '+c['卡關'])
    + statBox('下一個關鍵點', nx?('剩 '+nx.days+' 天'):'—', nx?esc(nx.id+'　'+nx.when):'');
}
function statsL3(q){
  const its=D.items.filter(i=>i.quarter===q), c=cnt(its);
  return statBox('工項', c['完成']+' / '+its.length)
    + statBox('進行中', c['進行中']) + statBox('卡關', c['卡關']) + statBox('未啟動', c['未啟動']);
}

/* ---------- 共用 SVG 元件 ---------- */
const DEFS = `<defs>
  <filter id="lift" x="-20%" y="-40%" width="140%" height="200%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1f2933" flood-opacity=".22"/></filter>
  <filter id="lift2" x="-20%" y="-40%" width="140%" height="200%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#1f2933" flood-opacity=".28"/></filter>
  <marker id="af" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="13" refY="13" orient="auto">
    <path d="M2,2 L24,13 L2,24 z" fill="var(--flow)"/></marker>
  <marker id="ad" markerWidth="8" markerHeight="8" refX="6.5" refY="3.4" orient="auto">
    <path d="M0,0 L7,3.4 L0,6.8 z" fill="var(--data)"/></marker>
  <marker id="ain" markerWidth="7" markerHeight="7" refX="5.5" refY="3.2" orient="auto">
    <path d="M0,0 L6.5,3.2 L0,6.4 z" fill="#c62828"/></marker>
  <marker id="ag" markerWidth="8" markerHeight="8" refX="6.5" refY="3.4" orient="auto">
    <path d="M0,0 L7,3.4 L0,6.8 z" fill="#9aa5b1"/></marker>
</defs>`;
function wrapText(s,x,y,lh,cls){
  return String(s).split('\n').map((t,i)=>`<tspan x="${x}" y="${y+i*lh}"${cls?' class="'+cls+'"':''}>${esc(t)}</tspan>`).join('');
}
function fillFor(base,status){
  if(status==='完成') return {fill:base, op:1, stroke:CV['完成'], dash:''};
  if(status==='進行中') return {fill:base, op:.62, stroke:CV['進行中'], dash:''};
  if(status==='卡關') return {fill:base, op:.62, stroke:CV['卡關'], dash:''};
  return {fill:base, op:.16, stroke:'#c3cad2', dash:'4 3'};
}

/* ---------- L1：三年架構圖 ---------- */
function svgL1(){
  const L=D.layout;
  if(!L) return '<p class="hint">找不到 98_執行規劃/dashboard-layout.json，無法繪製三年架構圖。</p>';
  const VBW=parseFloat((L.viewBox||'0 0 1240 800').split(/\s+/)[2])||1240;
  let s=`<svg viewBox="${L.viewBox}" style="width:100%;max-width:${VBW}px;min-width:1080px;height:auto">${DEFS}`;
  // 年度欄標題（可點進 L2）
  L.columns.forEach(c=>{
    const its=D.items.filter(i=>yearOf(i.quarter)===c.key), n=cnt(its);
    const tot=its.length||1, yc=ycOf(c.key);
    const PW=290, px=c.x-PW/2, py=(c.y||26)-24, PH=48;
    s+=`<g class="nd drill" onclick="go(2,'${c.key}')">
      <rect x="${px}" y="${py}" width="${PW}" height="${PH}" rx="13" fill="#fff" stroke="${tint(yc,.5)}" stroke-width="1.3" filter="url(#lift2)"/>
      <rect x="${px}" y="${py}" width="${PW}" height="${PH}" rx="13" fill="${tint(yc,.10)}" stroke="none"/>
      <rect x="${px}" y="${py}" width="6" height="${PH}" rx="3" fill="${yc}"/>
      <text x="${px+16}" y="${py+21}" font-size="14" font-weight="700" fill="${yc}">${esc(c.label)}</text>
      <text x="${px+PW-14}" y="${py+22}" text-anchor="end" font-size="17" fill="${tint(yc,.75)}">›</text>
      <rect x="${px+16}" y="${py+30}" width="${PW-40}" height="7" rx="3.5" fill="#eef1f4" stroke="${tint(yc,.28)}"/>`;
    let acc=px+16;
    ['完成','進行中','卡關'].forEach(k=>{ const ww=n[k]/tot*(PW-40); if(ww>0){ s+=`<rect x="${acc}" y="${py+30}" width="${ww}" height="7" rx="3.5" fill="${CV[k]}"/>`; acc+=ww; } });
    s+=`</g>`;
  });
  // 漏斗
  (L.shapes||[]).forEach(sh=>{
    s+=`<polygon points="${sh.points}" fill="var(--y1a)" opacity=".55"/>`;
    (sh.lines||[]).forEach(t=>{ s+=`<text x="${t.x}" y="${t.y}" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f4a58">${esc(t.text)}</text>`; });
  });
  // 側標
  (L.sideLabels||[]).forEach(t=>{
    s+=`<circle cx="${t.x+8}" cy="${t.toY}" r="4" fill="#1f4a58"/>
        <line x1="${t.x+8}" y1="${t.toY}" x2="${t.toX}" y2="${t.toY}" stroke="#1f4a58" stroke-width="1.4"/>
        <text x="${t.x+8}" y="${t.toY-12}" font-size="12" fill="#1f4a58">${esc(t.text)}</text>`;
  });
  // 輸入箭頭
  if(L.inputArrow){
    const ia=L.inputArrow;
    s+=`<path d="${ia.path}" fill="none" stroke="#c62828" stroke-width="3.2" marker-end="url(#ain)"/>
        <text x="${ia.x}" y="${ia.y}" font-size="12" font-weight="700" fill="#c62828">${wrapText(ia.text,ia.x,ia.y,15)}</text>`;
  }
  // 年度內方法流
  (L.flowEdges||[]).forEach(e=>{ s+=`<path d="${e.path}" fill="none" stroke="var(--flow)" stroke-width="${e.w||8}" marker-end="url(#af)"/>`; });
  // 跨年度資料流
  (L.dataEdges||[]).forEach(e=>{
    s+=`<path d="${e.path}" fill="none" stroke="var(--data)" stroke-width="1.8" marker-end="url(#ad)"/>
        <g class="nd" onclick="showFlow('${e.n}')"><circle cx="${e.badge[0]}" cy="${e.badge[1]}" r="11" fill="var(--data)"/>
        <text x="${e.badge[0]}" y="${e.badge[1]+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${e.n}</text></g>`;
  });
  // 節點
  const base={sub:'#8e6fa8', key:'var(--y1b)', y2:'var(--y2)', y3:'var(--y3)'};
  L.nodes.forEach(n=>{
    const st=nodeStatus(n), f=fillFor(base[n.style]||'#777', st), as=assetsOf(n);
    const cx=n.x+n.w/2, lines=String(n.label).split('\n');
    const ty=n.y+22 + (n.h>70 ? 8 : 0);
    s+=`<g class="nd" onclick="showNode('${n.id}')">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="${f.fill}" fill-opacity="${f.op}"
            stroke="${f.stroke}" stroke-width="2.4" stroke-dasharray="${f.dash}"/>
      <text text-anchor="middle" font-size="13.5" font-weight="700" fill="${st==='未啟動'?'#5b6672':'#fff'}">${wrapText(n.label,cx,ty,18)}</text>`;
    // 資產點（畫在方塊內下緣）
    const dy=n.y+n.h-13, gap=13, w=(as.length-1)*gap, sx=cx-w/2+18;
    as.forEach((a,i)=>{ s+=`<circle cx="${sx+i*gap}" cy="${dy}" r="4.3" fill="${CV[a.status]}" stroke="${st==='未啟動'?'#8d99a6':'#fff'}" stroke-width="1.2"/>`; });
    if(as.length) s+=`<text x="${sx-24}" y="${dy+4}" text-anchor="middle" font-size="10" fill="${st==='未啟動'?'#6b7784':'#fff'}">${as.filter(a=>a.status==='完成').length}/${as.length}</text>`;
    s+=`</g>`;
  });
  // 各年度關鍵點旗標
  L.columns.forEach(c=>{
    const dl=D.deadlines.filter(d=>d.year===c.key&&d.days!=null).sort((a,b)=>a.days-b.days);
    if(!dl.length) return;
    const y=(L.deadlineRow&&L.deadlineRow.y)||742, w=Math.min(dl.length,9)*26, x0=c.x-w/2;
    s+=`<text x="${c.x}" y="${y-10}" text-anchor="middle" font-size="10.5" fill="#6b7784">關鍵點</text>`;
    dl.slice(0,9).forEach((d,i)=>{
      s+=`<g class="nd" onclick="showDeadline('${d.id}')">
        <rect x="${x0+i*26}" y="${y}" width="21" height="15" rx="3" fill="${dlColor[dlState(d)]}"/>
        <text x="${x0+i*26+10.5}" y="${y+11.5}" text-anchor="middle" font-size="9" fill="#fff">${esc(d.id.replace('D-',''))}</text></g>`;
    });
  });
  return s+'</svg>';
}

/* ---------- L2：年度季節點圖 ---------- */
function svgL2(y){
  const qs=quarters.filter(q=>yearOf(q)===y);
  const CW=290, GAP=20, PAD=18;
  const perQ=qs.map(q=>D.items.filter(i=>i.quarter===q&&isKey(i)));
  const rows=Math.max(1,...perQ.map(a=>a.length));
  const W=PAD*2+qs.length*CW+(qs.length-1)*GAP;
  const dl=D.deadlines.filter(d=>d.year===y&&d.days!=null).sort((a,b)=>a.days-b.days);
  const chips=dlChips(dl, PAD, 0, W, PAD);
  const H=Math.max(300, 130+rows*58+chips.h+40);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="${svgStyle(W)}">${DEFS}`;
  const pos={};
  qs.forEach((q,qi)=>{
    const x=PAD+qi*(CW+GAP);
    s+=qCardSVG(q, x, 26, CW, y);
    perQ[qi].forEach((it,ri)=>{
      const ny=110+ri*58, f=fillFor('#4a5b6b',it.status);
      pos[it.id]={x:x, y:ny, w:CW, h:46};
      s+=`<g class="nd" onclick="showItem('${it.id}')">
        <rect x="${x}" y="${ny}" width="${CW}" height="46" rx="9" fill="#fff" stroke="${f.stroke}" stroke-width="1.8" stroke-dasharray="${f.dash}"/>
        <rect x="${x}" y="${ny}" width="5" height="46" rx="2.5" fill="${CV[it.status]}"/>
        <text x="${x+14}" y="${ny+19}" font-size="11" fill="#6b7784">${esc(it.id)}${/親力/.test(it.owner)?'　<tspan fill="#c62828">親力</tspan>':''}</text>
        <text x="${x+14}" y="${ny+36}" font-size="12.5" font-weight="600">${esc(dispName(it.name).length>20?dispName(it.name).slice(0,19)+'…':dispName(it.name))}</text></g>`;
    });
  });
  const keyIds=new Set([].concat(...perQ).map(i=>i.id));
  [].concat(...perQ).forEach(it=>{
    (it.deps||'').split(/[,、，]/).map(t=>t.trim()).filter(t=>keyIds.has(t)).forEach(dep=>{
      const a=pos[dep], b=pos[it.id]; if(!a||!b||a.x>=b.x) return;
      const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2, mx=(x1+x2)/2;
      s+=`<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2-8} ${y2}" fill="none" stroke="#9aa5b1" stroke-width="1.4" marker-end="url(#ag)" opacity=".8"/>`;
    });
  });
  if(dl.length) s+=dlChips(dl, PAD, H-chips.h-4, W, PAD).html;
  return zoomBar(W)+s+'</svg>';
}

/* ---------- L3：季工項依賴圖 ---------- */
/* 本圖一律畫出該季全部工項，不做任何摺疊或隱藏——摺疊會讓「圖上格數」與統計條的「工項數」對不起來。
   不需要追蹤的工項請直接自執行框架.md 刪除並移入已撤銷工項節，不要在渲染層想辦法藏。 */
function svgL3(q){
  const its=D.items.filter(i=>i.quarter===q);
  const ids=new Set(its.map(i=>i.id));
  const deps={}; its.forEach(i=>deps[i.id]=[...new Set((i.deps||'').split(/[,、，]/).map(t=>t.trim()).filter(t=>ids.has(t)&&t!==i.id))]);
  const depth={}; let guard=0;
  const calc=id=>{ if(depth[id]!=null) return depth[id]; if(guard++>4000) return 0;
    depth[id]=0; const d=deps[id].length?Math.max(...deps[id].map(calc))+1:0; depth[id]=d; return d; };
  its.forEach(i=>calc(i.id));
  const layers={}; its.forEach(i=>{ (layers[depth[i.id]]=layers[depth[i.id]]||[]).push(i); });
  const NW=198, NH=48, GX=224, GY=58, PAD=14;
  const ln=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  const W=PAD*2+ln.length*GX, H=PAD*2+Math.max(...ln.map(l=>layers[l].length))*GY+20;
  const pos={};
  ln.forEach((l,li)=>layers[l].forEach((it,ri)=>{ pos[it.id]={x:PAD+li*GX, y:PAD+20+ri*GY}; }));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="${svgStyle(W)}">${DEFS}`;
  its.forEach(i=>deps[i.id].forEach(d=>{
    const a=pos[d], b=pos[i.id]; if(!a||!b) return;
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    s+=`<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2-8} ${y2}" fill="none" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ag)" opacity=".9"/>`;
  }));
  its.forEach(i=>{
    const p=pos[i.id], f=fillFor('#4a5b6b',i.status);
    s+=`<g class="nd" onclick="showItem('${i.id}')">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="9" fill="#fff" stroke="${f.stroke}" stroke-width="1.8" stroke-dasharray="${f.dash}"/>
      <rect x="${p.x}" y="${p.y}" width="5" height="${NH}" rx="2.5" fill="${CV[i.status]}"/>
      <text x="${p.x+13}" y="${p.y+18}" font-size="10.5" fill="#6b7784">${esc(i.id)}${i.inferred?'　推斷':''}${/親力/.test(i.owner)?'　<tspan fill="#c62828">親力</tspan>':''}</text>
      <text x="${p.x+13}" y="${p.y+36}" font-size="12" font-weight="600">${esc(dispName(i.name).length>15?dispName(i.name).slice(0,14)+'…':dispName(i.name))}</text></g>`;
  });
  return zoomBar(W)+s+'</svg>';
}

/* ---------- 季別總表（Q1–Q4 另一種看法） ---------- */
function miniBar(c){
  const t=Object.values(c).reduce((a,b)=>a+b,0)||1;
  return '<span class="mb">'+['完成','進行中','卡關','未啟動'].map(k=>
    c[k]?`<span style="width:${c[k]/t*100}%;background:${CV[k]}"></span>`:'').join('')+'</span>';
}
const pct = c => Math.round((c['完成']||0)/(Object.values(c).reduce((a,b)=>a+b,0)||1)*100);

/* 共用：季卡（L1 季別總覽與 L2 皆用此繪法） */
function qCardSVG(q, x, y, w, key){
  const its=D.items.filter(i=>i.quarter===q), c=cnt(its), tot=its.length||1;
  const yc=ycOf(key);
  let s=`<g class="nd drill" onclick="go(3,'${key}','${q}')">
    <rect x="${x}" y="${y}" width="${w}" height="58" rx="11" fill="#fff" stroke="${tint(yc,.5)}" filter="url(#lift)"/>
    <rect x="${x}" y="${y}" width="${w}" height="58" rx="11" fill="${tint(yc,.10)}" stroke="none"/>
    <rect x="${x}" y="${y}" width="5" height="58" rx="2.5" fill="${yc}"/>
    <text x="${x+16}" y="${y+24}" font-size="15" font-weight="700" fill="${yc}">${esc(q)}</text>
    <text x="${x+w-30}" y="${y+24}" text-anchor="end" font-size="12" fill="#6b7784">${its.length} 工項｜完成 ${c['完成']}</text>
    <text x="${x+w-13}" y="${y+26}" text-anchor="end" font-size="17" fill="${tint(yc,.75)}">›</text>
    <rect x="${x+16}" y="${y+36}" width="${w-30}" height="7" rx="3.5" fill="#eef1f4" stroke="${tint(yc,.28)}"/>`;
  let acc=x+16;
  ['完成','進行中','卡關'].forEach(k=>{ const ww=c[k]/tot*(w-30); if(ww>0){ s+=`<rect x="${acc}" y="${y+36}" width="${ww}" height="7" rx="3.5" fill="${CV[k]}"/>`; acc+=ww; } });
  return s+'</g>';
}

/* 共用：關鍵點膠囊列（自動換行、寬度隨文字長度） */
function dlChips(dl, x0, y0, W, PAD){
  if(!dl.length) return {html:'', h:0};
  const CH=170, GAP=8, per=Math.max(1,Math.floor((W-PAD*2+GAP)/(CH+GAP)));
  let s=`<text x="${x0}" y="${y0-8}" font-size="11" fill="#6b7784">關鍵點</text>`;
  dl.forEach((d,i)=>{
    const cx=x0+(i%per)*(CH+GAP), cy=y0+Math.floor(i/per)*32;
    s+=`<g class="nd" onclick="showDeadline('${d.id}')">
      <rect x="${cx}" y="${cy}" width="${CH}" height="26" rx="5" fill="${dlColor[dlState(d)]}" fill-opacity=".14" stroke="${dlColor[dlState(d)]}"/>
      <text x="${cx+9}" y="${cy+17}" font-size="10.5" fill="#37424e">${esc(d.id)}　${esc(d.when)}　${d.days<0?'已過':'剩 '+d.days+' 天'}</text></g>`;
  });
  return {html:s, h:Math.ceil(dl.length/per)*32+10};
}

function quarterCards(){
  const W=1180, PAD=16, GAP=14, YH=30, CH=58, YGAP=26;
  const groups=D.years.map(y=>({y, key:keyOf(y.year), qs:quarters.filter(q=>yearOf(q)===keyOf(y.year))}))
                      .filter(g=>g.qs.length);
  const H=PAD*2+groups.reduce((a,g)=>a+YH+CH+YGAP,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:940px;height:auto">${DEFS}`;
  let cy=PAD+16;
  groups.forEach(g=>{
    const yc=cnt(D.items.filter(i=>yearOf(i.quarter)===g.key));
    const tot=Object.values(yc).reduce((a,b)=>a+b,0);
    s+=`<g class="nd" onclick="go(2,'${g.key}')">
      <rect x="${PAD}" y="${cy-12}" width="${String(g.y.year).length*15+26}" height="18" rx="9" fill="${ycOf(g.key)}" filter="url(#lift)"/>
      <text x="${PAD+String(g.y.year).length*15+18}" y="${cy+1}" font-size="12" fill="#fff">›</text>
      <text x="${PAD+8}" y="${cy+1}" font-size="12.5" font-weight="700" fill="#fff">${esc(g.y.year)}</text>
      <text x="${PAD+ String(g.y.year).length*15 + 36}" y="${cy}" font-size="11.5" fill="#6b7784">${esc(g.y.period)}　｜　完成 ${yc['完成']}／${tot}　（${pct(yc)}%）</text></g>`;
    cy+=14;
    const n=g.qs.length, w=(W-PAD*2-(n-1)*GAP)/n;
    g.qs.forEach((q,i)=>{ s+=qCardSVG(q, PAD+i*(w+GAP), cy, w, g.key); });
    cy+=CH+YGAP;
  });
  return '<div class="blk"><h3>季別總覽（點季卡進入該季工項層，點年度名進入年度層）</h3>'+s+'</svg></div>';
}

/* ---------- 發表軌（甘特式，對照研究進度與可帶來的發表） ---------- */
const ym = s => { const m=String(s).match(/(\d{4})-(\d{1,2})/); return m? (+m[1])*12+(+m[2]-1) : null; };
function pubTrack(){
  const P=D.publications||[]; if(!P.length) return '';
  const all=P.flatMap(p=>[ym(p.start),ym(p.end),ym(p.submit)]).filter(v=>v!=null);
  if(!all.length) return '';
  const lo=Math.min(...all), hi=Math.max(...all)+1;
  const LW=88, W=1180, PW=W-LW-16, ROW=26, H=44+P.length*ROW+18;
  const x=v=>LW+(v-lo)/(hi-lo)*PW;
  const now=new Date(); const nowm=now.getFullYear()*12+now.getMonth();
  let s=`<div class="blk"><h3>發表軌（撰寫窗＝進度條，◆＝投稿窗；條內填色＝資料基礎工項之完成比例）</h3>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:900px;height:auto">`;
  // 年度刻度
  for(let y=Math.floor(lo/12); y<=Math.floor(hi/12); y++){
    const xx=Math.max(LW, x(y*12));
    s+=`<line x1="${xx}" y1="24" x2="${xx}" y2="${H-16}" stroke="#eceff2"/>
        <text x="${xx+3}" y="18" font-size="10.5" fill="#6b7784">${y}</text>`;
  }
  if(nowm>=lo&&nowm<=hi) s+=`<line x1="${x(nowm)}" y1="22" x2="${x(nowm)}" y2="${H-16}" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="${x(nowm)+3}" y="${H-6}" font-size="10" fill="#c62828">今天</text>`;
  P.forEach((p,i)=>{
    const y0=32+i*ROW, a=ym(p.start), b=ym(p.end), sb=ym(p.submit);
    const nsc=p.track==='NSC';
    const yk=(String(p.id).match(/^Y\d/)||[])[0];
    const done=p.items.filter(t=>byId[t]&&byId[t].status==='完成').length;
    const ratio=p.items.length?done/p.items.length:0;
    const base=nsc?ycOf(yk||'Y1'):'#b3bac2';
    const st=p.status;
    const fin=(st==='已投稿'||st==='已刊登');
    s+=`<text x="6" y="${y0+13}" font-size="11.5" font-weight="${nsc?'700':'400'}" fill="${nsc?base:'#8d99a6'}">${esc(p.id)}</text>`;
    if(a!=null&&b!=null){
      const bw=Math.max(6,x(b+1)-x(a));
      s+=`<g class="nd" onclick="showPub('${esc(p.id)}')">
        <rect x="${x(a)}" y="${y0}" width="${bw}" height="16" rx="4" fill="${base}" fill-opacity="${nsc?.22:.12}" stroke="${base}" stroke-opacity=".65"/>`;
      if(fin) s+=`<rect x="${x(a)}" y="${y0}" width="${bw}" height="16" rx="4" fill="${CV['完成']}" fill-opacity=".8"/>`;
      else if(ratio>0) s+=`<rect x="${x(a)}" y="${y0}" width="${bw*ratio}" height="16" rx="4" fill="${CV['完成']}" fill-opacity=".75"/>`;
      s+='</g>';
      const lx=(sb!=null? x(sb+1)+11 : x(b+1)+6);
      s+=`<text x="${lx}" y="${y0+12}" font-size="10.5" fill="${nsc?'#37424e':'#a3adb8'}">${esc(p.name.length>24?p.name.slice(0,23)+'…':p.name)}</text>`;
    }
    if(sb!=null) s+=`<g class="nd" onclick="showPub('${esc(p.id)}')"><polygon points="${x(sb+1)},${y0+2} ${x(sb+1)+7},${y0+8} ${x(sb+1)},${y0+14} ${x(sb+1)-7},${y0+8}" fill="${fin?CV['完成']:(nsc?base:'#8d99a6')}"/></g>`;
  });
  s+='</svg><div class="hint">實心＝資料基礎工項已完成之比例（無對應工項者不填色）；顏色依年度（Y1 紫／Y2 橘／Y3 綠），灰色列為競爭同一寫作窗的外部論文。細節見 98_執行規劃/publications.md 與發表 pipeline。</div></div>';
  return s;
}
function showPub(id){
  const p=(D.publications||[]).find(x=>x.id===id); if(!p) return;
  const done=p.items.filter(t=>byId[t]&&byId[t].status==='完成').length;

                  meetings:['會議紀錄','07_行政聯繫/會議紀錄'], pending:['待晉升暫存','05_輸出']};
