"badge": [480, 356], "desc": "本土化框架 → Y2 內部問卷構面（核心／延伸模型切分）"}, {"n": "3", "path": "M 800 443 H 880 V 189 H 976", "badge": [880, 318], "desc": "內部問卷共用構面 → Y3 外部問卷；內外部對照為本計畫招牌設計，題項凍結清單為依據"}, {"n": "4", "path": "M 360 570 H 900 V 389 H 976", "badge": [640, 570], "desc": "風險治理矩陣三類缺口（規範／執行／信任）→ Y3 三階段利害關係人訪談之主題架構"}], "deadlineRow": {"y": 630}}, "publications": [{"id": "Y1-1", "name": "PSSVC 理論框架：AI 治理價值鏈的理論建構", "track": "NSC", "authors": "", "start": "2026-08", "end": "2026-10", "submit": "2026-10", "journal": "", "items": ["Y1Q1-19"], "status": "已投稿", "submit_src": "portfolio-status"}, {"id": "Y1-2", "name": "AI 類型學：本土化評估框架與應用地圖", "track": "NSC", "authors": "", "start": "2027-07", "end": "2027-12", "submit": "2027-12", "journal": "", "items": ["Y1Q2-01", "Y1Q2-02", "Y1Q3-01", "Y1Q3-02"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y1-3", "name": "風險治理矩陣：演算法國境的多層次治理分析", "track": "NSC", "authors": "", "start": "2028-01", "end": "2028-06", "submit": "2028-06", "journal": "", "items": ["Y1Q2-05", "Y1Q3-03", "Y1Q4-02"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y2-1", "name": "移民官裁量策略：依從／抵抗／混合型態", "track": "NSC", "authors": "", "start": "2028-07", "end": "2028-12", "submit": "2028-12", "journal": "", "items": ["Y2Q1-02", "Y2Q1-04"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y2-2", "name": "移民官情境實驗：警示強度×責任提示", "track": "NSC", "authors": "", "start": "2029-01", "end": "2029-06", "submit": "2029-06", "journal": "", "items": ["Y2Q2-04", "Y2Q3-01"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y2-3", "name": "移民官問卷 SEM：可信任 AI→內部評價", "track": "NSC", "authors": "", "start": "2029-07", "end": "2029-12", "submit": "2029-12", "journal": "", "items": ["Y2Q3-02"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y3-1", "name": "三階段利害關係人訪談：治理設計藍圖", "track": "NSC", "authors": "", "start": "2030-01", "end": "2030-06", "submit": "2030-06", "journal": "", "items": ["Y3Q3-01", "Y3Q3-02", "Y3Q3-03", "Y3Q3-04"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y3-2", "name": "外部民眾問卷 SEM：期望失驗→滿意度→正當性", "track": "NSC", "authors": "", "start": "2030-07", "end": "2030-12", "submit": "2030-12", "journal": "", "items": ["Y3Q2-01"], "status": "未投稿", "submit_src": "portfolio-status"}, {"id": "Y3-3", "name": "內外部多群組 SEM：員工—民眾落差", "track": "NSC", "authors": "", "start": "2031-01", "end": "2031-06", "submit": "2031-06", "journal": "", "items": ["Y2Q3-02", "Y3Q2-01", "Y3Q2-03"], "status": "未投稿", "submit_src": "portfolio-status"}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const CV = {'完成':'#2e7d32','進行中':'#1565c0','卡關':'#c62828','未啟動':'#b3bac2'};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 名稱顯示層：【重點】【非重點】為 L2 重點工項清單之控制標記，不對使用者顯示 */
const dispName = s => (s==null?'':String(s)).replace(/【重點】|【非重點】/g,'');
const byId = {}; D.items.forEach(i=>byId[i.id]=i);

document.getElementById('pname').textContent = D.plan['計畫名稱'] || D.project_root;
document.getElementById('hmeta').innerHTML = esc(D.plan['計畫編號']||'') +
  '｜' + esc(D.plan['全程期程']||'') + '｜生成 ' + esc(D.generated_at);

/* ---------- 狀態彙總 ---------- */
function roll(ids){
  const st = ids.map(x=>byId[x] ? byId[x].status : '未啟動');
  if(!st.length) return '未啟動';
  if(st.includes('卡關')) return '卡關';
  if(st.every(s=>s==='完成')) return '完成';
  if(st.some(s=>s==='完成'||s==='進行中')) return '進行中';
  return '未啟動';
}
const allAssets = [];
(D.layout ? D.layout.nodes : []).forEach(n=>(n.assets||[]).forEach(a=>{
  allAssets.push({name:a.name, items:a.items, node:n.id, col:n.col, status:roll(a.items)});
}));
const assetsOf = n => allAssets.filter(a=>a.node===n.id);
const nodeStatus = n => roll([].concat(...(n.assets||[]).map(a=>a.items)));
const yearOf = q => q==='P0' ? 'P0 預備期' : (q.match(/^Y\d/)||[''])[0];
const keyOf = y => y.startsWith('P0') ? 'P0 預備期' : y;
/* 季別一律依年、季序排列，不依工項在框架檔中的出現順序（工項改隸他季時順序才不會亂） */
const quarters = [...new Set(D.items.map(i=>i.quarter))].sort((a,b)=>{ const m=x=>(/Y(\d+)Q(\d+)/.exec(x)||[0,99,9]); const p=m(a),q=m(b); return (p[1]-q[1])||(p[2]-q[2])||(a<b?-1:1); });
const cnt = list => { const c={完成:0,進行中:0,卡關:0,未啟動:0}; list.forEach(i=>c[i.status]++); return c; };
const dlState = d => d.days==null ? 'none' : (d.days<0 ? 'past' : (d.days<=30 ? 'near' : (d.days<=90 ? 'soon' : 'far')));
const dlColor = {past:'#8d99a6', near:'#c62828', soon:'#e8a33d', far:'#b3bac2', none:'#b3bac2'};
/* 年度色票：與 L1 架構圖之欄位識別色一致 */
const YC = {'P0 預備期':'#5b7083','Y1':'#7b2d8e','Y2':'#c0632a','Y3':'#1b5e3f'};
const ycOf = k => YC[k] || '#5b7083';
const tint = (hex,a) => { const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

/* ---------- 重點工項（L2 用）：有對應資產、或親力、或掛關鍵點；名稱可用【重點】強制納入、【非重點】強制排除 ---------- */
const assetItemIds = new Set([].concat(...allAssets.map(a=>a.items)));
const isKey = i => !/【非重點】/.test(i.name) && (/【重點】/.test(i.name) || assetItemIds.has(i.id) || /親力/.test(i.owner) || /D-\d/.test(i.due));

/* ---------- 路由 ---------- */
let route = {level:1, year:null, quarter:null};
/* 圖面縮放：'fit' 縮到容器寬（鳥瞰）／'real' 原尺寸＋水平捲動（文字恆為原字級） */
let zoom = 'real';
function setZoom(z){ zoom=z; render(); }
/* W 小於容器時一律原尺寸，不放大；大於時依 zoom 決定縮放或捲動 */
function svgStyle(W, fitMin){
  if(zoom==='fit') return `width:100%;max-width:${W}px;height:auto`;
  return `width:${W}px;max-width:${W}px;height:auto`;
}
function zoomBar(W){
  if(W<=1300) return '';
  return `<div class="zbar">圖寬 ${Math.round(W)}px
    <button class="${zoom==='real'?'on':''}" onclick="setZoom('real')">原尺寸（可讀）</button>
    <button class="${zoom==='fit'?'on':''}" onclick="setZoom('fit')">符合寬度（鳥瞰）</button></div>`;
}
function go(l,y,q){ route={level:l,year:y,quarter:q}; render(); window.scrollTo(0,0); }

function render(){
  const S=document.getElementById('stage'), L=document.getElementById('legend'),
        T=document.getElementById('strip'), C=document.getElementById('crumb'), ST=document.getElementById('stats');
  const c=['<a onclick="go(1)">三年架構</a>'];
  if(route.year) c.push(route.level>2?`<a onclick="go(2,'${route.year}')">${route.year}</a>`:`<b>${route.year}</b>`);
  if(route.quarter) c.push(`<b>${route.quarter}</b>`);
  C.innerHTML=c.join(' ＞ ');
  const E=document.getElementById('extra');
  if(route.level===1){ ST.innerHTML=statsL1(); S.innerHTML=svgL1(); L.innerHTML=legendL1(); T.innerHTML=''; E.innerHTML=quarterCards()+pubTrack(); }
  else if(route.level===2){ ST.innerHTML=statsL2(route.year); S.innerHTML=svgL2(route.year); L.innerHTML=legendStatus('點季節點進入工項層'); T.innerHTML=''; E.innerHTML=''; }
  else { ST.innerHTML=statsL3(route.quarter); S.innerHTML=svgL3(route.quarter); L.innerHTML=legendStatus('由左至右為依賴順序，連線顏色依上游工項區分；滑過節點標出整條上下游，點節點看工項卡'); T.innerHTML=''; E.innerHTML=''; }
}
const statBox = (lb,vl,sub,act)=>`<div class="stat${act?' nd act':''}"${act?' onclick="'+act+'"':''}><div class="lb">${lb}${act?' <span style="opacity:.55">›</span>':''}</div><div class="vl">${vl}${sub?' <small>'+sub+'</small>':''}</div></div>`;
function legendStatus(hint){
  return ['完成','進行中','卡關','未啟動'].map(k=>`<span><i style="background:${CV[k]}"></i>${k}</span>`).join('')
    + `<span style="margin-left:auto;color:#6b7784">${hint}</span>`;
}
function legendL1(){
  return legendStatus('點方塊看該階段產出資產；點年度標題進入年度層')

/* ---------- 統計條 ---------- */
function statsL1(){
  const a=allAssets, done=a.filter(x=>x.status==='完成').length;
  const dl=D.deadlines.filter(d=>d.days!=null);
  const near=dl.filter(d=>d.days>=0&&d.days<=90), past=dl.filter(d=>d.days<0);
  const nx=dl.filter(d=>d.days>=0).sort((x,y)=>x.days-y.days)[0];
  const c=cnt(D.items);
  return statBox('產出資產到位', done+' / '+a.length, '', "showAssets()")
    + statBox('下一個關鍵點', nx?('剩 '+nx.days+' 天'):'—', nx?esc(nx.id+'　'+nx.when):'', nx?("showDeadline('"+nx.id+"')"):'')
    + statBox('關鍵點', near.length+' 項', '90 天內｜已過 '+past.length, "showDeadlines()")
    + statBox('工項', c['完成']+' / '+D.items.length, '進行中 '+c['進行中']+'｜卡關 '+c['卡關'], "showItems()");
}
function statsL2(y){
  const its=D.items.filter(i=>yearOf(i.quarter)===y), c=cnt(its);
  const a=allAssets.filter(x=>x.col===y);
  const dl=D.deadlines.filter(d=>d.year===y), nx=dl.filter(d=>d.days>=0).sort((p,q)=>p.days-q.days)[0];
  const yy=D.years.find(x=>keyOf(x.year)===y);
  return statBox('年度主題', '<span style="font-size:14px">'+esc(yy?yy.theme:'—')+'</span>')
    + statBox('產出資產', a.filter(x=>x.status==='完成').length+' / '+a.length)
    + statBox('工項', c['完成']+' / '+its.length, '進行中 '+c['進行中']+'｜卡關 '+c['卡關'])
    + statBox('下一個關鍵點', nx?('剩 '+nx.days+' 天'):'—', nx?esc(nx.id+'　'+nx.when):'');
}
function statsL3(q){
  const its=D.items.filter(i=>i.quarter===q), c=cnt(its);
  return statBox('工項', c['完成']+' / '+its.length)
    + statBox('進行中', c['進行中']) + statBox('卡關', c['卡關']) + statBox('未啟動', c['未啟動']);
}

  <marker id="ad" markerWidth="8" markerHeight="8" refX="6.5" refY="3.4" orient="auto">

function wrapText(s,x,y,lh,cls){
  return String(s).split('\n').map((t,i)=>`<tspan x="${x}" y="${y+i*lh}"${cls?' class="'+cls+'"':''}>${esc(t)}</tspan>`).join('');
}
function fillFor(base,status){
  if(status==='完成') return {fill:base, op:1, stroke:CV['完成'], dash:''};
  if(status==='進行中') return {fill:base, op:.62, stroke:CV['進行中'], dash:''};
  if(status==='卡關') return {fill:base, op:.62, stroke:CV['卡關'], dash:''};
  return {fill:base, op:.16, stroke:'#c3cad2', dash:'4 3'};
}

/* ---------- L1：三年架構圖 ---------- */
function svgL1(){
  const L=D.layout;
  if(!L) return '<p class="hint">找不到 98_執行規劃/dashboard-layout.json，無法繪製三年架構圖。</p>';
  const VBW=parseFloat((L.viewBox||'0 0 1240 800').split(/\s+/)[2])||1240;
  let s=`<svg viewBox="${L.viewBox}" style="width:100%;max-width:${VBW}px;min-width:1080px;height:auto">${DEFS}`;
  // 年度欄標題（可點進 L2）
  L.columns.forEach(c=>{
    const its=D.items.filter(i=>yearOf(i.quarter)===c.key), n=cnt(its);
    const tot=its.length||1, yc=ycOf(c.key);
    const PW=290, px=c.x-PW/2, py=(c.y||26)-24, PH=48;
    s+=`<g class="nd drill" onclick="go(2,'${c.key}')">
      <rect x="${px}" y="${py}" width="${PW}" height="${PH}" rx="13" fill="#fff" stroke="${tint(yc,.5)}" stroke-width="1.3" filter="url(#lift2)"/>
      <rect x="${px}" y="${py}" width="${PW}" height="${PH}" rx="13" fill="${tint(yc,.10)}" stroke="none"/>
      <rect x="${px}" y="${py}" width="6" height="${PH}" rx="3" fill="${yc}"/>
      <text x="${px+16}" y="${py+21}" font-size="14" font-weight="700" fill="${yc}">${esc(c.label)}</text>
      <text x="${px+PW-14}" y="${py+22}" text-anchor="end" font-size="17" fill="${tint(yc,.75)}">›</text>
      <rect x="${px+16}" y="${py+30}" width="${PW-40}" height="7" rx="3.5" fill="#eef1f4" stroke="${tint(yc,.28)}"/>`;
    let acc=px+16;
    ['完成','進行中','卡關'].forEach(k=>{ const ww=n[k]/tot*(PW-40); if(ww>0){ s+=`<rect x="${acc}" y="${py+30}" width="${ww}" height="7" rx="3.5" fill="${CV[k]}"/>`; acc+=ww; } });
    s+=`</g>`;
  });
  // 漏斗
  (L.shapes||[]).forEach(sh=>{
    s+=`<polygon points="${sh.points}" fill="var(--y1a)" opacity=".55"/>`;
    (sh.lines||[]).forEach(t=>{ s+=`<text x="${t.x}" y="${t.y}" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f4a58">${esc(t.text)}</text>`; });
  });
  // 側標
  (L.sideLabels||[]).forEach(t=>{
    s+=`<circle cx="${t.x+8}" cy="${t.toY}" r="4" fill="#1f4a58"/>
        <line x1="${t.x+8}" y1="${t.toY}" x2="${t.toX}" y2="${t.toY}" stroke="#1f4a58" stroke-width="1.4"/>
        <text x="${t.x+8}" y="${t.toY-12}" font-size="12" fill="#1f4a58">${esc(t.text)}</text>`;
  });
  // 輸入箭頭
  if(L.inputArrow){
    const ia=L.inputArrow;
    s+=`<path d="${ia.path}" fill="none" stroke="#c62828" stroke-width="3.2" marker-end="url(#ain)"/>
        <text x="${ia.x}" y="${ia.y}" font-size="12" font-weight="700" fill="#c62828">${wrapText(ia.text,ia.x,ia.y,15)}</text>`;
  }
  // 年度內方法流
  (L.flowEdges||[]).forEach(e=>{ s+=`<path d="${e.path}" fill="none" stroke="var(--flow)" stroke-width="${e.w||8}" marker-end="url(#af)"/>`; });
  // 跨年度資料流
  (L.dataEdges||[]).forEach(e=>{
    s+=`<path d="${e.path}" fill="none" stroke="var(--data)" stroke-width="1.8" marker-end="url(#ad)"/>
        <g class="nd" onclick="showFlow('${e.n}')"><circle cx="${e.badge[0]}" cy="${e.badge[1]}" r="11" fill="var(--data)"/>
        <text x="${e.badge[0]}" y="${e.badge[1]+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${e.n}</text></g>`;
  });
  // 節點
  const base={sub:'#8e6fa8', key:'var(--y1b)', y2:'var(--y2)', y3:'var(--y3)'};
  L.nodes.forEach(n=>{
    const st=nodeStatus(n), f=fillFor(base[n.style]||'#777', st), as=assetsOf(n);
    const cx=n.x+n.w/2, lines=String(n.label).split('\n');
    const ty=n.y+22 + (n.h>70 ? 8 : 0);
    s+=`<g class="nd" onclick="showNode('${n.id}')">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="${f.fill}" fill-opacity="${f.op}"
            stroke="${f.stroke}" stroke-width="2.4" stroke-dasharray="${f.dash}"/>
      <text text-anchor="middle" font-size="13.5" font-weight="700" fill="${st==='未啟動'?'#5b6672':'#fff'}">${wrapText(n.label,cx,ty,18)}</text>`;
    // 資產點（畫在方塊內下緣）
    const dy=n.y+n.h-13, gap=13, w=(as.length-1)*gap, sx=cx-w/2+18;
    as.forEach((a,i)=>{ s+=`<circle cx="${sx+i*gap}" cy="${dy}" r="4.3" fill="${CV[a.status]}" stroke="${st==='未啟動'?'#8d99a6':'#fff'}" stroke-width="1.2"/>`; });
    if(as.length) s+=`<text x="${sx-24}" y="${dy+4}" text-anchor="middle" font-size="10" fill="${st==='未啟動'?'#6b7784':'#fff'}">${as.filter(a=>a.status==='完成').length}/${as.length}</text>`;
    s+=`</g>`;
  });
  // 各年度關鍵點旗標
  L.columns.forEach(c=>{
    const dl=D.deadlines.filter(d=>d.year===c.key&&d.days!=null).sort((a,b)=>a.days-b.days);
    if(!dl.length) return;
    const y=(L.deadlineRow&&L.deadlineRow.y)||742, w=Math.min(dl.length,9)*26, x0=c.x-w/2;
    s+=`<text x="${c.x}" y="${y-10}" text-anchor="middle" font-size="10.5" fill="#6b7784">關鍵點</text>`;
    dl.slice(0,9).forEach((d,i)=>{
      s+=`<g class="nd" onclick="showDeadline('${d.id}')">
        <rect x="${x0+i*26}" y="${y}" width="21" height="15" rx="3" fill="${dlColor[dlState(d)]}"/>
        <text x="${x0+i*26+10.5}" y="${y+11.5}" text-anchor="middle" font-size="9" fill="#fff">${esc(d.id.replace('D-',''))}</text></g>`;
    });
  });
  return s+'</svg>';
}

/* ---------- L2：年度季節點圖 ---------- */
function svgL2(y){
  const qs=quarters.filter(q=>yearOf(q)===y);
  const CW=270, GAP=64, PAD=18, NH=46, GY=58, TOP=110;
  const perQ=qs.map(q=>D.items.filter(i=>i.quarter===q&&isKey(i)));
  const all=[].concat(...perQ), keyIds=new Set(all.map(i=>i.id));
  const qi={}; perQ.forEach((a,k)=>a.forEach(i=>qi[i.id]=k));
  const deps={}, kids={};
  all.forEach(i=>{ kids[i.id]=[]; deps[i.id]=[...new Set((i.deps||'').split(/[,、，]/).map(t=>t.replace(/[（(].*$/,'').trim()).filter(t=>keyIds.has(t)&&qi[t]<qi[i.id]))]; });
  all.forEach(i=>deps[i.id].forEach(d=>kids[d].push(i.id)));
  L2G={deps,kids};
  /* 欄內排序：有連線者依上游平均列位排（往返兩輪），無連線者排在下方，減少交叉 */
  const rank={}; perQ.forEach(a=>a.forEach((it,r)=>rank[it.id]=r));
  const bary=(id,nb)=>{ const a=nb[id]; return a.length?a.reduce((s,x)=>s+rank[x],0)/a.length:1e3+rank[id]; };
  for(let pass=0;pass<2;pass++){
    perQ.forEach((a,k)=>{ if(k===0) return; a.sort((p,q)=>bary(p.id,deps)-bary(q.id,deps)||(p.id<q.id?-1:1)); a.forEach((it,r)=>rank[it.id]=r); });
    perQ.slice(0,-1).reverse().forEach(a=>{ a.sort((p,q)=>bary(p.id,kids)-bary(q.id,kids)||(p.id<q.id?-1:1)); a.forEach((it,r)=>rank[it.id]=r); });
  }
  const rows=Math.max(1,...perQ.map(a=>a.length));
  const W=PAD*2+qs.length*CW+(qs.length-1)*GAP;
  const dl=D.deadlines.filter(d=>d.year===y&&d.days!=null).sort((a,b)=>a.days-b.days);
  const chips=dlChips(dl, PAD, 0, W, PAD);
  const H=Math.max(300, TOP+20+rows*GY+chips.h+40);
  const PAL=['#2563eb','#d97706','#059669','#db2777','#7c3aed','#0891b2','#65a30d','#dc2626','#4f46e5','#a16207'];
  let s=`<svg id="l2svg" viewBox="0 0 ${W} ${H}" style="${svgStyle(W)}">${DEFS}<defs>`+
    PAL.map((c,k)=>`<marker id="l2m${k}" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${c}"/></marker>`).join('')+`</defs>`;
  const pos={};
  qs.forEach((q,k)=>{ const x=PAD+k*(CW+GAP); s+=qCardSVG(q, x, 26, CW, y); perQ[k].forEach((it,r)=>pos[it.id]={x, y:TOP+r*GY}); });
  const srcs=all.filter(i=>kids[i.id].length).sort((a,b)=>pos[a.id].x-pos[b.id].x||pos[a.id].y-pos[b.id].y);
  const col={}; srcs.forEach((i,k)=>col[i.id]=PAL[k%PAL.length]);
  const off=(arr,n)=>(n-(arr.length-1)/2)*Math.min(8,(NH-12)/Math.max(arr.length-1,1));
  all.forEach(i=>deps[i.id].forEach(d=>{
    const a=pos[d], b=pos[i.id]; if(!a||!b) return;
    const ks=[...kids[d]].sort((p,q)=>pos[p].y-pos[q].y), ps=[...deps[i.id]].sort((p,q)=>pos[p].y-pos[q].y);
    const x1=a.x+CW, y1=a.y+NH/2+off(ks,ks.indexOf(i.id)), x2=b.x-2, y2=b.y+NH/2+off(ps,ps.indexOf(d));
    const c=col[d], k=PAL.indexOf(c), G=GAP/2;
    const span=qi[i.id]-qi[d], gy=b.y-(GY-NH)/2;
    const dd=span>=2?`M ${x1} ${y1} C ${x1+G*0.6} ${y1}, ${x1+G*0.4} ${gy}, ${x1+G} ${gy} L ${x2-G} ${gy} C ${x2-G*0.4} ${gy}, ${x2-G*0.6} ${y2}, ${x2-7} ${y2}`
      :`M ${x1} ${y1} C ${x1+G} ${y1}, ${x2-G} ${y2}, ${x2-7} ${y2}`;
    s+=`<path class="l3e" data-f="${d}" data-t="${i.id}" d="${dd}" fill="none" stroke="${c}" stroke-width="1.9" marker-end="url(#l2m${k})"/>`;
  }));
  all.forEach(it=>{
    const p=pos[it.id], f=fillFor('#4a5b6b',it.status), nm=dispName(it.name);
    s+=`<g class="nd l3n" data-id="${it.id}" onmouseenter="hlChain('l2svg',L2G,'${it.id}')" onmouseleave="hlChain('l2svg',L2G,null)" onclick="showItem('${it.id}')">
      <rect x="${p.x}" y="${p.y}" width="${CW}" height="${NH}" rx="9" fill="#fff" stroke="${f.stroke}" stroke-width="1.8" stroke-dasharray="${f.dash}"/>
      <rect x="${p.x}" y="${p.y}" width="5" height="${NH}" rx="2.5" fill="${CV[it.status]}"/>
      <text x="${p.x+14}" y="${p.y+19}" font-size="11" fill="#6b7784">${esc(it.id)}${/親力/.test(it.owner)?'　<tspan fill="#c62828">親力</tspan>':''}</text>
      <text x="${p.x+14}" y="${p.y+36}" font-size="12.5" font-weight="600">${esc(nm.length>19?nm.slice(0,18)+'…':nm)}</text></g>`;
  });
  if(dl.length) s+=dlChips(dl, PAD, H-chips.h-4, W, PAD).html;
  return zoomBar(W)+s+'</svg>';
}
let L2G={deps:{},kids:{}};
/* 滑過節點：標出整條上下游鏈，其餘淡化（L2、L3 共用） */
function hlChain(svgId,G,id){
  const sv=document.getElementById(svgId); if(!sv) return;
  sv.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  if(!id){ sv.classList.remove('hl'); return; }
  const set=new Set([id]);
  const walk=(x,m)=>(m[x]||[]).forEach(z=>{ if(!set.has(z)){ set.add(z); walk(z,m); } });
  walk(id,G.deps); const up=new Set(set); set.clear(); set.add(id); walk(id,G.kids); up.forEach(x=>set.add(x));
  sv.classList.add('hl');
  sv.querySelectorAll('.l3n').forEach(g=>{ if(set.has(g.dataset.id)) g.classList.add('on'); });
  sv.querySelectorAll('.l3e').forEach(e=>{ if(set.has(e.dataset.f)&&set.has(e.dataset.t)) e.classList.add('on'); });
}

/* ---------- L3：季工項依賴圖 ---------- */
/* 本圖一律畫出該季全部工項，不做任何摺疊或隱藏——摺疊會讓「圖上格數」與統計條的「工項數」對不起來。
   不需要追蹤的工項請直接自執行框架.md 刪除並移入已撤銷工項節，不要在渲染層想辦法藏。 */
function svgL3(q){
  const its=D.items.filter(i=>i.quarter===q);
  const ids=new Set(its.map(i=>i.id));
  const deps={}, kids={};
  its.forEach(i=>{ kids[i.id]=[]; deps[i.id]=[...new Set((i.deps||'').split(/[,、，]/).map(t=>t.replace(/[（(].*$/,'').trim()).filter(t=>ids.has(t)&&t!==i.id))]; });
  its.forEach(i=>deps[i.id].forEach(d=>kids[d].push(i.id)));
  L3G={deps,kids};
  const iso=its.filter(i=>!deps[i.id].length&&!kids[i.id].length).sort((a,b)=>a.id<b.id?-1:1);
  const flow=its.filter(i=>deps[i.id].length||kids[i.id].length);
  const depth={}; let guard=0;
  const calc=id=>{ if(depth[id]!=null) return depth[id]; if(guard++>4000) return 0;
    depth[id]=0; const d=deps[id].length?Math.max(...deps[id].map(calc))+1:0; depth[id]=d; return d; };
  flow.forEach(i=>calc(i.id));
  const layers={}; flow.forEach(i=>{ (layers[depth[i.id]]=layers[depth[i.id]]||[]).push(i); });
  const ln=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  /* 層內排序：重心法（上游平均位置）往返兩輪，減少連線交叉 */
  const rank={};
  ln.forEach(l=>{ layers[l].sort((a,b)=>a.id<b.id?-1:1); layers[l].forEach((it,r)=>rank[it.id]=r); });
  const bary=(id,nb)=>{ const a=nb[id].filter(x=>rank[x]!=null); return a.length?a.reduce((s,x)=>s+rank[x],0)/a.length:rank[id]; };
  for(let pass=0;pass<2;pass++){
    ln.slice(1).forEach(l=>{ layers[l].sort((a,b)=>bary(a.id,deps)-bary(b.id,deps)||(a.id<b.id?-1:1)); layers[l].forEach((it,r)=>rank[it.id]=r); });
    ln.slice(0,-1).reverse().forEach(l=>{ layers[l].sort((a,b)=>bary(a.id,kids)-bary(b.id,kids)||(a.id<b.id?-1:1)); layers[l].forEach((it,r)=>rank[it.id]=r); });
  }
  const NW=212, NH=58, GX=304, GY=74, PAD=16, HEAD=34;
  const rows=ln.length?Math.max(...ln.map(l=>layers[l].length)):0;
  const isoCols=Math.max(ln.length,3), isoRows=Math.ceil(iso.length/isoCols);
  const flowH=rows*GY, isoTop=PAD+HEAD+flowH+(flow.length?26:0);
  const W=PAD*2+Math.max(ln.length,iso.length?isoCols:1)*GX-(GX-NW);
  const H=isoTop+(iso.length?28+isoRows*GY:0)+PAD;
  const pos={};
  ln.forEach((l,li)=>layers[l].forEach((it,ri)=>{ pos[it.id]={x:PAD+li*GX, y:PAD+HEAD+ri*GY}; }));
  iso.forEach((it,k)=>{ pos[it.id]={x:PAD+(k%isoCols)*GX, y:isoTop+28+Math.floor(k/isoCols)*GY}; });
  const PAL=['#2563eb','#d97706','#059669','#db2777','#7c3aed','#0891b2','#65a30d','#dc2626','#4f46e5','#a16207'];
  const srcs=flow.filter(i=>kids[i.id].length).sort((a,b)=>pos[a.id].x-pos[b.id].x||pos[a.id].y-pos[b.id].y);
  const col={}; srcs.forEach((i,k)=>col[i.id]=PAL[k%PAL.length]);
  let s=`<svg id="l3svg" viewBox="0 0 ${W} ${H}" style="${svgStyle(W)}">${DEFS}<defs>`+
    PAL.map((c,k)=>`<marker id="l3m${k}" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${c}"/></marker>`).join('')+`</defs>`;
  ln.forEach((l,li)=>{ s+=`<text x="${PAD+li*GX+NW/2}" y="${PAD+14}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b7784">${li===0?'起點':'第 '+(li+1)+' 步'}</text>`; });
  if(iso.length){ s+=`<line x1="${PAD}" y1="${isoTop+6}" x2="${W-PAD}" y2="${isoTop+6}" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <text x="${PAD}" y="${isoTop+22}" font-size="11.5" font-weight="700" fill="#6b7784">獨立推進（本季內無前後依賴）</text>`; }
  /* 連線：每個上游節點一個顏色；出入口依目標／來源上下位置錯開，避免線束重疊 */
  const outOff={}, inOff={};
  flow.forEach(i=>{ const ks=[...kids[i.id]].sort((a,b)=>pos[a].y-pos[b].y); ks.forEach((k,n)=>outOff[i.id+'>'+k]=(n-(ks.length-1)/2)*Math.min(9,(NH-14)/Math.max(ks.length-1,1)));
    const ps=[...deps[i.id]].sort((a,b)=>pos[a].y-pos[b].y); ps.forEach((p,n)=>inOff[p+'>'+i.id]=(n-(ps.length-1)/2)*Math.min(9,(NH-14)/Math.max(ps.length-1,1))); });
  flow.forEach(i=>deps[i.id].forEach(d=>{
    const a=pos[d], b=pos[i.id]; if(!a||!b) return;
    const key=d+'>'+i.id, c=col[d], k=PAL.indexOf(c);
    const x1=a.x+NW, y1=a.y+NH/2+outOff[key], x2=b.x-2, y2=b.y+NH/2+inOff[key], dx=Math.max(40,(x2-x1)*0.5);
    /* 跨兩層以上的長線改走列間走廊，不從中間層的節點底下穿過 */
    const span=depth[i.id]-depth[d], gy=b.y-(GY-NH)/2+(outOff[key]||0)*0.3, G=(GX-NW)/2;
    const dd=span>=2?`M ${x1} ${y1} C ${x1+G*0.6} ${y1}, ${x1+G*0.4} ${gy}, ${x1+G} ${gy} L ${x2-G} ${gy} C ${x2-G*0.4} ${gy}, ${x2-G*0.6} ${y2}, ${x2-7} ${y2}`
      :`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2-7} ${y2}`;
    s+=`<path class="l3e" data-f="${d}" data-t="${i.id}" d="${dd}" fill="none" stroke="${c}" stroke-width="1.9" marker-end="url(#l3m${k})"/>`;
  }));
  its.forEach(i=>{
    const p=pos[i.id], f=fillFor('#4a5b6b',i.status), nm=dispName(i.name), due=i.due?String(i.due):'';
    s+=`<g class="nd l3n" data-id="${i.id}" onmouseenter="hlChain('l3svg',L3G,'${i.id}')" onmouseleave="hlChain('l3svg',L3G,null)" onclick="showItem('${i.id}')">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="9" fill="#fff" stroke="${f.stroke}" stroke-width="1.8" stroke-dasharray="${f.dash}"/>
      <rect x="${p.x}" y="${p.y}" width="5" height="${NH}" rx="2.5" fill="${CV[i.status]}"/>
      <text x="${p.x+13}" y="${p.y+16}" font-size="10.5" fill="#6b7784">${esc(i.id)}${i.inferred?'　推斷':''}${/親力/.test(i.owner)?'　<tspan fill="#c62828">親力</tspan>':''}</text>
      <text x="${p.x+13}" y="${p.y+34}" font-size="12" font-weight="600">${esc(nm.length>16?nm.slice(0,15)+'…':nm)}</text>
      <text x="${p.x+13}" y="${p.y+50}" font-size="10.5" fill="#8a94a0">${esc(due?('預定 '+(due.length>20?due.slice(0,19)+'…':due)):'')}</text></g>`;
  });
  return zoomBar(W)+s+'</svg>';
}

function miniBar(c){
  const t=Object.values(c).reduce((a,b)=>a+b,0)||1;
  return '<span class="mb">'+['完成','進行中','卡關','未啟動'].map(k=>
    c[k]?`<span style="width:${c[k]/t*100}%;background:${CV[k]}"></span>`:'').join('')+'</span>';
}
const pct = c => Math.round((c['完成']||0)/(Object.values(c).reduce((a,b)=>a+b,0)||1)*100);

/* 共用：季卡（L1 季別總覽與 L2 皆用此繪法） */
function qCardSVG(q, x, y, w, key){
  const its=D.items.filter(i=>i.quarter===q), c=cnt(its), tot=its.length||1;
  const yc=ycOf(key);
  let s=`<g class="nd drill" onclick="go(3,'${key}','${q}')">
    <rect x="${x}" y="${y}" width="${w}" height="58" rx="11" fill="#fff" stroke="${tint(yc,.5)}" filter="url(#lift)"/>
    <rect x="${x}" y="${y}" width="${w}" height="58" rx="11" fill="${tint(yc,.10)}" stroke="none"/>
    <rect x="${x}" y="${y}" width="5" height="58" rx="2.5" fill="${yc}"/>
    <text x="${x+16}" y="${y+24}" font-size="15" font-weight="700" fill="${yc}">${esc(q)}</text>
    <text x="${x+w-30}" y="${y+24}" text-anchor="end" font-size="12" fill="#6b7784">${its.length} 工項｜完成 ${c['完成']}</text>
    <text x="${x+w-13}" y="${y+26}" text-anchor="end" font-size="17" fill="${tint(yc,.75)}">›</text>
    <rect x="${x+16}" y="${y+36}" width="${w-30}" height="7" rx="3.5" fill="#eef1f4" stroke="${tint(yc,.28)}"/>`;
  let acc=x+16;
  ['完成','進行中','卡關'].forEach(k=>{ const ww=c[k]/tot*(w-30); if(ww>0){ s+=`<rect x="${acc}" y="${y+36}" width="${ww}" height="7" rx="3.5" fill="${CV[k]}"/>`; acc+=ww; } });
  return s+'</g>';
}

/* 共用：關鍵點膠囊列（自動換行、寬度隨文字長度） */
function dlChips(dl, x0, y0, W, PAD){
  if(!dl.length) return {html:'', h:0};
  const CH=170, GAP=8, per=Math.max(1,Math.floor((W-PAD*2+GAP)/(CH+GAP)));
  let s=`<text x="${x0}" y="${y0-8}" font-size="11" fill="#6b7784">關鍵點</text>`;
  dl.forEach((d,i)=>{
    const cx=x0+(i%per)*(CH+GAP), cy=y0+Math.floor(i/per)*32;
    s+=`<g class="nd" onclick="showDeadline('${d.id}')">
      <rect x="${cx}" y="${cy}" width="${CH}" height="26" rx="5" fill="${dlColor[dlState(d)]}" fill-opacity=".14" stroke="${dlColor[dlState(d)]}"/>
      <text x="${cx+9}" y="${cy+17}" font-size="10.5" fill="#37424e">${esc(d.id)}　${esc(d.when)}　${d.days<0?'已過':'剩 '+d.days+' 天'}</text></g>`;
  });
  return {html:s, h:Math.ceil(dl.length/per)*32+10};
}

function quarterCards(){
  const W=1180, PAD=16, GAP=14, YH=30, CH=58, YGAP=26;
  const groups=D.years.map(y=>({y, key:keyOf(y.year), qs:quarters.filter(q=>yearOf(q)===keyOf(y.year))}))
                      .filter(g=>g.qs.length);
  const H=PAD*2+groups.reduce((a,g)=>a+YH+CH+YGAP,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:940px;height:auto">${DEFS}`;
  let cy=PAD+16;
  groups.forEach(g=>{
    const yc=cnt(D.items.filter(i=>yearOf(i.quarter)===g.key));
    const tot=Object.values(yc).reduce((a,b)=>a+b,0);
    s+=`<g class="nd" onclick="go(2,'${g.key}')">
      <rect x="${PAD}" y="${cy-12}" width="${String(g.y.year).length*15+26}" height="18" rx="9" fill="${ycOf(g.key)}" filter="url(#lift)"/>
      <text x="${PAD+String(g.y.year).length*15+18}" y="${cy+1}" font-size="12" fill="#fff">›</text>
      <text x="${PAD+8}" y="${cy+1}" font-size="12.5" font-weight="700" fill="#fff">${esc(g.y.year)}</text>
      <text x="${PAD+ String(g.y.year).length*15 + 36}" y="${cy}" font-size="11.5" fill="#6b7784">${esc(g.y.period)}　｜　完成 ${yc['完成']}／${tot}　（${pct(yc)}%）</text></g>`;
    cy+=14;
    const n=g.qs.length, w=(W-PAD*2-(n-1)*GAP)/n;
    g.qs.forEach((q,i)=>{ s+=qCardSVG(q, PAD+i*(w+GAP), cy, w, g.key); });
    cy+=CH+YGAP;
  });
  return '<div class="blk"><h3>季別總覽（點季卡進入該季工項層，點年度名進入年度層）</h3>'+s+'</svg></div>';
}

/* ---------- 發表軌（甘特式，對照研究進度與可帶來的發表） ---------- */
const ym = s => { const m=String(s).match(/(\d{4})-(\d{1,2})/); return m? (+m[1])*12+(+m[2]-1) : null; };
function pubTrack(){
  const P=D.publications||[]; if(!P.length) return '';
  const all=P.flatMap(p=>[ym(p.start),ym(p.end),ym(p.submit)]).filter(v=>v!=null);
  if(!all.length) return '';
  const lo=Math.min(...all), hi=Math.max(...all)+1;
  const LW=88, W=1180, PW=W-LW-16, ROW=26, H=44+P.length*ROW+18;
  const x=v=>LW+(v-lo)/(hi-lo)*PW;
  const now=new Date(); const nowm=now.getFullYear()*12+now.getMonth();
  let s=`<div class="blk"><h3>發表軌（撰寫窗＝進度條，◆＝投稿窗；條內填色＝資料基礎工項之完成比例）</h3>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:900px;height:auto">`;
  // 年度刻度
  for(let y=Math.floor(lo/12); y<=Math.floor(hi/12); y++){
    const xx=Math.max(LW, x(y*12));
    s+=`<line x1="${xx}" y1="24" x2="${xx}" y2="${H-16}" stroke="#eceff2"/>
        <text x="${xx+3}" y="18" font-size="10.5" fill="#6b7784">${y}</text>`;
  }
  if(nowm>=lo&&nowm<=hi) s+=`<line x1="${x(nowm)}" y1="22" x2="${x(nowm)}" y2="${H-16}" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="${x(nowm)+3}" y="${H-6}" font-size="10" fill="#c62828">今天</text>`;
  P.forEach((p,i)=>{
    const y0=32+i*ROW, a=ym(p.start), b=ym(p.end), sb=ym(p.submit);
    const nsc=p.track==='NSC';
    const yk=(String(p.id).match(/^Y\d/)||[])[0];
    const done=p.items.filter(t=>byId[t]&&byId[t].status==='完成').length;
    const ratio=p.items.length?done/p.items.length:0;
    const base=nsc?ycOf(yk||'Y1'):'#b3bac2';
    const st=p.status;
    const fin=(st==='已投稿'||st==='已刊登');
    s+=`<text x="6" y="${y0+13}" font-size="11.5" font-weight="${nsc?'700':'400'}" fill="${nsc?base:'#8d99a6'}">${esc(p.id)}</text>`;
    if(a!=null&&b!=null){
      const bw=Math.max(6,x(b+1)-x(a));
      s+=`<g class="nd" onclick="showPub('${esc(p.id)}')">
        <rect x="${x(a)}" y="${y0}" width="${bw}" height="16" rx="4" fill="${base}" fill-opacity="${nsc?.22:.12}" stroke="${base}" stroke-opacity=".65"/>`;
      if(fin) s+=`<rect x="${x(a)}" y="${y0}" width="${bw}" height="16" rx="4" fill="${CV['完成']}" fill-opacity=".8"/>`;
      else if(ratio>0) s+=`<rect x="${x(a)}" y="${y0}" width="${bw*ratio}" height="16" rx="4" fill="${CV['完成']}" fill-opacity=".75"/>`;
      s+='</g>';
      const lx=(sb!=null? x(sb+1)+11 : x(b+1)+6);
      s+=`<text x="${lx}" y="${y0+12}" font-size="10.5" fill="${nsc?'#37424e':'#a3adb8'}">${esc(p.name.length>24?p.name.slice(0,23)+'…':p.name)}</text>`;
    }
    if(sb!=null) s+=`<g class="nd" onclick="showPub('${esc(p.id)}')"><polygon points="${x(sb+1)},${y0+2} ${x(sb+1)+7},${y0+8} ${x(sb+1)},${y0+14} ${x(sb+1)-7},${y0+8}" fill="${fin?CV['完成']:(nsc?base:'#8d99a6')}"/></g>`;
  });
  s+='</svg><div class="hint">實心＝資料基礎工項已完成之比例（無對應工項者不填色）；顏色依年度（Y1 紫／Y2 橘／Y3 綠），投稿窗與投稿狀態取自 portfolio-status.md。</div></div>';
  return s;
}

    ${Object.keys(by).map(col=>`<div style="margin-top:10px"><div style="font-size:11px;color:#6b7784;letter-spacing:.08em;font-weight:700">${esc(col)}</div>
      ${by[col].map(a=>`<div class="mini" style="margin-top:5px">${pill(a.status)}<b>${esc(a.name)}</b>
        <div style="color:#6b7784;font-size:11.5px;margin-top:3px">來源工項：${a.items.map(x=>`<a onclick="showItem('${x}')" style="color:#1f6f8b;cursor:pointer">${esc(x)}</a>`).join('、')}</div></div>`).join('')}
    </div>`).join('')}
    <div class="hint">資產與節點的對應定義在 98_執行規劃/dashboard-layout.json。</div>`);
}
function showDeadlines(){
  const ds=D.deadlines.slice().sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999'));
  const by={}; ds.forEach(d=>{ (by[d.year||'未歸年度']=by[d.year||'未歸年度']||[]).push(d); });
  const tone=d=> d.days==null?'#b8c0cb' : d.days<0?'#8d99a6' : d.days<=30?'#e0364f' : d.days<=90?'#f0a11c' : '#5b7083';
  open_(`<h3>關鍵點總覽　${ds.length} 項</h3>
    <div style="font-size:12px;color:#6b7784;margin-bottom:8px">紅＝30 天內、黃＝90 天內、灰＝已過。點任一項看未達成之處置。</div>
    ${Object.keys(by).map(y=>`<div style="margin-top:10px"><div style="font-size:11px;color:#6b7784;letter-spacing:.08em;font-weight:700">${esc(y)}　${by[y].length} 項</div>
      ${by[y].map(d=>`<div class="mini nd" style="margin-top:5px" onclick="showDeadline('${esc(d.id)}')">
        <span class="pill" style="background:${tone(d)}">${esc(d.id)}</span><b>${esc(d.name)}</b>
        <div style="color:#6b7784;font-size:11.5px;margin-top:3px">${esc(d.when)}${d.days!=null?'　'+(d.days<0?'已過':'剩 '+d.days+' 天'):''}</div></div>`).join('')}
    </div>`).join('')}`);
}
function showItems(){
  const c=cnt(D.items);
  const moving=D.items.filter(i=>i.status!=='未啟動');
  const byQ={}; D.items.forEach(i=>{ (byQ[i.quarter]=byQ[i.quarter]||[]).push(i); });
  const qs=Object.keys(byQ);
  const row=i=>`<div class="mini nd" style="margin-top:5px" onclick="showItem('${esc(i.id)}')">
      ${pill(i.status)}<b>${esc(i.id)}</b>　${esc(dispName(i.name).length>30?dispName(i.name).slice(0,29)+'…':dispName(i.name))}
      <div style="color:#6b7784;font-size:11.5px;margin-top:3px">${esc(i.quarter)}　${esc(i.owner)}${i.last_log?'　｜　'+esc(i.last_log):''}</div></div>`;
  open_(`<h3>工項　${c['完成']} / ${D.items.length} 完成</h3>
    <div style="font-size:12px;color:#6b7784;margin-bottom:8px">106 項全列反而看不到重點，故只列「有動靜的」＋各季計數。要看某季全部工項，點該季列進第三層。</div>
    ${c['卡關']?`<div style="font-size:11px;color:#6b7784;letter-spacing:.08em;font-weight:700;margin-top:10px">卡關 ${c['卡關']} 項</div>`+moving.filter(i=>i.status==='卡關').map(row).join(''):''}
    <div style="font-size:11px;color:#6b7784;letter-spacing:.08em;font-weight:700;margin-top:10px">進行中 ${c['進行中']} 項</div>
    ${c['進行中']?moving.filter(i=>i.status==='進行中').map(row).join(''):'<div class="mini" style="margin-top:5px">無</div>'}
    <div style="font-size:11px;color:#6b7784;letter-spacing:.08em;font-weight:700;margin-top:10px">已完成 ${c['完成']} 項</div>
    ${c['完成']?moving.filter(i=>i.status==='完成').map(row).join(''):'<div class="mini" style="margin-top:5px">無</div>'}
    <div style="font-size:11px;color:#6b7784;letter-spacing:.08em;font-weight:700;margin-top:14px">各季分佈（點季進工項層）</div>
    ${qs.map(q=>{ const cc=cnt(byQ[q]); const tot=byQ[q].length; const pct=Math.round(cc['完成']/tot*100);
      return `<div class="mini nd" style="margin-top:5px" onclick="closeModal();go(3,null,'${esc(q)}')">
        <b>${esc(q)}</b>　<span style="color:#6b7784;font-size:11.5px">${tot} 項｜完成 ${cc['完成']}・進行中 ${cc['進行中']}・卡關 ${cc['卡關']}・未啟動 ${cc['未啟動']}</span>
        <div style="margin-top:4px;height:6px;border-radius:3px;background:#e7ebf0;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${CV['完成']}"></div></div></div>`;}).join('')}
    <div class="hint">工項全集正本為 98_執行規劃/執行框架.md。</div>`);
}
function gotoU(){
  closeModal();
  const el=document.getElementById('strip');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function showPendingDocs(){
  const pd=D.decisions.pending_docs||[];
  open_(`<h3>待同步文件　${pd.length} 項</h3>
    <div style="font-size:12px;color:#6b7784;margin-bottom:8px">決議已下、但基準文件尚未修訂者（決議條目之「文件連動」行標為待改）。原則是<b>先改文件、再記紀錄</b>；此面板存在的唯一理由，是承接「修訂範圍須先核定」的例外，清掉即消失。</div>
    ${pd.length?pd.map(x=>`<div class="mini" style="margin-top:5px">
        <span class="pill" style="background:#e0364f">待改</span><b>${esc(x.doc)}</b>
        <div style="color:#6b7784;font-size:11.5px;margin-top:3px">${esc(x.date)}　${esc(x.entry)}</div></div>`).join('')
      :'<div class="mini">無。決議與文件目前同步。</div>'}
    <div class="hint">正本見 00_專案控制/決議紀錄.md 各條目之「文件連動」行。</div>`);
}
function showFlow(n){
  const e=D.layout.dataEdges.find(x=>x.n===n); if(!e) return;
  open_(`<h3>跨年度資料流 ${esc(n)}</h3><div style="margin-top:8px">${esc(e.desc)}</div>`);
}
document.getElementById('home').addEventListener('click', ()=>{ closeModal(); go(1); });
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('src').innerHTML =
  '<p>掃描：'+D.sources.map(s=>'<code>'+esc(s)+'</code>').join('　')+'</p>'
  +'<p>已解析 log：'+(D.log_files.map(f=>'<code>'+esc(f)+'</code>').join('、')||'（無）')+'</p>'
  +'<p>快照非正本：正本為各 log.md 與決議紀錄.md；不一致時修本頁。</p>';
render();
</script>
